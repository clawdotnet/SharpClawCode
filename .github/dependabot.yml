version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft-dotnet:
        patterns: ["Microsoft.*", "System.*"]
  - package-ecosystem: npm
    directory: /extensions/vscode
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
